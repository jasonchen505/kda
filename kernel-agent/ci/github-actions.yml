name: kernel-agent-harness

on:
  push:
    branches: [codex/kernel-agent-harness]
    paths: [kernel-agent/**, .github/workflows/kernel-agent.yml]
  pull_request:
    paths: [kernel-agent/**, .github/workflows/kernel-agent.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kernel-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check flows scripts src tests
      - run: python3 scripts/verify_evidence.py
      - run: bash -n scripts/reproduce.sh scripts/reproduce_existing_selector.sh scripts/start_cached_qwen27.sh scripts/start_local_model.sh
