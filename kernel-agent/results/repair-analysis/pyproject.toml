[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-kernel-agent"
version = "0.1.0"
description = "A local-model kernel generation harness with independent GPU evaluation and auditable selection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "hmz @ git+https://github.com/jasonchen505/humanize.git@d7f732e935100047d0faa5fc7c4d6b03ce350fc7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.16.5,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These standalone scripts bootstrap the source path before importing the package.
"scripts/audit_selector_validation.py" = ["E402"]
"scripts/build_report.py" = ["E402"]
"scripts/summarize_strategy.py" = ["E402"]
"scripts/verify_evidence.py" = ["E402"]
"scripts/run_campaign.py" = ["E402"]
"scripts/validate_recovery.py" = ["E402"]
